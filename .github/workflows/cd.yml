name: CD

# Entrega continua: IaC -> staging -> pruebas pre-prod -> (aprobación) -> production blue/green
# -> pruebas post-prod -> rollback automático si fallan.
# Corre en un runner self-hosted con kind (los ambientes persisten entre jobs).
on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      api_image: { type: string, required: true }
      frontend_image: { type: string, required: true }
      deploy_production: { type: boolean, default: false }
      simulate_failure: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      version:
        description: "Versión publicada en GHCR (ej. 1.2.0)"
        required: true
      deploy_production:
        description: "Promover a production"
        type: boolean
        default: true
      simulate_failure:
        description: "DEMO: forzar fallo del smoke post-prod para ver el rollback automático"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-taskflow
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve artifact
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      api_image: ${{ steps.r.outputs.api_image }}
      frontend_image: ${{ steps.r.outputs.frontend_image }}
    steps:
      - id: r
        env:
          VERSION: ${{ inputs.version }}
          API_IMAGE: ${{ inputs.api_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$VERSION"
            echo "api_image=${API_IMAGE:-ghcr.io/$OWNER/taskflow-api:$VERSION}"
            echo "frontend_image=${FRONTEND_IMAGE:-ghcr.io/$OWNER/taskflow-frontend:$VERSION}"
          } | tee -a "$GITHUB_OUTPUT"

  # ───────────── IaC ─────────────
  iac:
    name: IaC – Terraform (kind + namespaces)
    needs: resolve
    runs-on: [self-hosted, kind]
    steps:
      - uses: actions/checkout@v4
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false -backend-config="path=$HOME/.taskflow/terraform.tfstate"
      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply (deploy infra staging + production)
        working-directory: infra/terraform
        run: |
          terraform apply -input=false -auto-approve tfplan
          echo "### 🏗️ Infraestructura" >> "$GITHUB_STEP_SUMMARY"
          terraform output -json environment_urls | jq -r 'to_entries[] | "- **\(.key)**: \(.value)"' >> "$GITHUB_STEP_SUMMARY"

  # ───────────── STAGING ─────────────
  deploy-staging:
    name: Deploy staging (blue/green)
    needs: [resolve, iac]
    runs-on: [self-hosted, kind]
    environment:
      name: staging
      url: http://localhost:8080
    outputs:
      active: ${{ steps.deploy.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull artefacto
        run: |
          docker pull "${{ needs.resolve.outputs.api_image }}"
          docker pull "${{ needs.resolve.outputs.frontend_image }}"
      - name: Deploy
        id: deploy
        run: scripts/deploy.sh staging "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.api_image }}" "${{ needs.resolve.outputs.frontend_image }}"

  test-preprod:
    name: Tests pre-prod (E2E + carga) en staging
    needs: [resolve, deploy-staging]
    runs-on: [self-hosted, kind]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke staging
        run: scripts/smoke.sh staging "${{ needs.resolve.outputs.version }}"
      - name: E2E integración (pytest + httpx)
        env:
          BASE_URL: http://localhost:8080
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pytest==8.3.4 httpx==0.28.1
          .venv/bin/pytest tests/e2e -v --junitxml=e2e-junit.xml
      - name: Carga ligera (k6)
        run: |
          docker run --rm --network host -v "$PWD/tests/load:/scripts" \
            -e BASE_URL=http://localhost:8080 grafana/k6:0.55.0 run --summary-export=/scripts/k6-summary.json /scripts/smoke-load.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preprod-reports
          path: |
            e2e-junit.xml
            tests/load/k6-summary.json

  rollback-staging:
    name: Rollback automático staging
    needs: [deploy-staging, test-preprod]
    if: failure() && needs.deploy-staging.result == 'success'
    runs-on: [self-hosted, kind]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/rollback.sh staging
      - uses: ./.github/actions/notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "TaskFlow: rollback automático en staging"
          message: "Fallaron las pruebas pre-prod de v${{ inputs.version }}. Tráfico devuelto al color anterior."

  # ───────────── PRODUCTION ─────────────
  deploy-production:
    name: Deploy production (blue/green, requiere aprobación)
    needs: [resolve, test-preprod]
    if: inputs.deploy_production
    runs-on: [self-hosted, kind]
    environment:
      name: production   # Required reviewers -> aprobación manual
      url: http://localhost:8081
    outputs:
      active: ${{ steps.deploy.outputs.active }}
      previous: ${{ steps.deploy.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull artefacto
        run: |
          docker pull "${{ needs.resolve.outputs.api_image }}"
          docker pull "${{ needs.resolve.outputs.frontend_image }}"
      - name: Deploy blue/green
        id: deploy
        run: scripts/deploy.sh production "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.api_image }}" "${{ needs.resolve.outputs.frontend_image }}"

  test-postprod:
    name: Tests post-prod (smoke) en production
    needs: [resolve, deploy-production]
    runs-on: [self-hosted, kind]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests production
        run: scripts/smoke.sh production "${{ needs.resolve.outputs.version }}"
      - name: "DEMO: fallo simulado"
        if: inputs.simulate_failure
        run: |
          echo "::error::Fallo simulado del smoke post-prod (simulate_failure=true)"
          exit 1

  rollback-production:
    name: Rollback automático production
    needs: [deploy-production, test-postprod]
    if: failure() && needs.deploy-production.result == 'success'
    runs-on: [self-hosted, kind]
    steps:
      - uses: actions/checkout@v4
      - id: rb
        run: scripts/rollback.sh production
      - name: Verificar versión restaurada
        run: scripts/smoke.sh production "${{ steps.rb.outputs.version }}"
      - uses: ./.github/actions/notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "TaskFlow: rollback automático en production"
          message: "Smoke post-prod falló para v${{ inputs.version }}. Restaurada v${{ steps.rb.outputs.version }}."

  notify:
    name: Notificar resultado
    needs: [resolve, deploy-staging, test-preprod, deploy-production, test-postprod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ (contains(needs.*.result, 'failure') && 'failure') || 'success' }}
          title: "TaskFlow v${{ needs.resolve.outputs.version }} – CD ${{ (contains(needs.*.result, 'failure') && 'FALLÓ') || 'OK' }}"
          message: |
            staging: ${{ needs.deploy-staging.result }} · pre-prod: ${{ needs.test-preprod.result }}
            production: ${{ needs.deploy-production.result }} · post-prod: ${{ needs.test-postprod.result }}

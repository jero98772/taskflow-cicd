apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: taskflow, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: taskflow, component: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: taskflow, component: frontend }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: frontend
          image: taskflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: taskflow, component: frontend }
spec:
  type: NodePort
  selector: { app: taskflow, component: frontend }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
labels:
  - pairs: { environment: production }
patches:
  - target: { kind: Service, name: frontend }
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081

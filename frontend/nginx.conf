server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El frontend actúa como gateway: /api y /version se enrutan al Service "api"
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /version { proxy_pass http://api:8000/version; }
    location = /health  { proxy_pass http://api:8000/health; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.html; }
}
